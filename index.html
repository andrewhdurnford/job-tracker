<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tracker</title>
    <link rel="preload" href="fonts/Lexend.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="fonts/Tinos.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>"
    />
  </head>
  <body>
    <header>
      <h1>Job Tracker</h1>
      <p id="status" class="status">Loading…</p>
    </header>

    <section class="filters" id="filters" hidden>
      <input id="q" type="search" placeholder="Search" autocomplete="off" />
      <select id="level">
        <option value="">All levels</option>
        <option value="intern">Internships</option>
        <option value="new-grad">New grad</option>
        <option value="experienced">Experienced</option>
      </select>
      <select id="region">
        <option value="us-remote">US &amp; Remote</option>
        <option value="all">US, Canada &amp; Remote</option>
        <option value="canada-remote">Canada &amp; Remote</option>
        <option value="remote">Remote only</option>
      </select>
      <select id="term" hidden><option value="">All terms</option></select>
      <select id="company"><option value="">All companies</option></select>
      <input id="location" type="search" placeholder="Location…" autocomplete="off" />
      <label class="check">
        <input id="recent" type="checkbox" />
        New in last 24h
      </label>
      <button id="reset" type="button">Reset</button>
    </section>

    <p id="count" class="count"></p>
    <ul id="jobs" class="jobs"></ul>

    <footer>
      <span id="companies-footer"></span>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
