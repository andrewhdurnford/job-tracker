<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Tracker</title>
    <link rel="preload" href="fonts/Lilex.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23001a23'/><circle cx='50' cy='50' r='24' fill='%231db954'/></svg>"
    />
  </head>
  <body>
    <header>
      <h1>Job Tracker</h1>
      <p id="status" class="status">Loading…</p>
    </header>

    <section class="filters" id="filters" hidden>
      <input id="q" type="search" placeholder="Search" autocomplete="off" />
      <select id="level">
        <option value="">All levels</option>
        <option value="intern">Internships</option>
        <option value="new-grad">New grad</option>
        <option value="experienced">Experienced</option>
      </select>
      <select id="term" hidden><option value="">All terms</option></select>
    </section>

    <p id="count" class="count"></p>
    <ul id="jobs" class="jobs"></ul>

    <script src="app.js" type="module"></script>
  </body>
</html>
